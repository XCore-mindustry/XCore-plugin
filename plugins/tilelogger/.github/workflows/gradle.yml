name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest

          - os: linux
            arch: arm
            runner: ubuntu-22.04-arm

          - os: windows
            arch: x64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build project
        run: |
          ./gradlew check jarRelease --refresh-dependencies
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.os }}-${{ matrix.arch }}
          path: build/libs/TileLogger-release.jar

      - name: Check benchmark tooling (no timing thresholds)
        if: matrix.os == 'linux' && matrix.arch == 'x64'
        run: |
          python3 scripts/test-compare-bench.py
          scripts/bench-ab.sh HEAD 1 -- --n 10000 --reps 1 --seconds 1 --rate 120
          ./gradlew jmhJar
          mkdir -p build/results/jmh
          java --enable-native-access=ALL-UNNAMED -jar build/libs/TileLogger-jmh.jar -foe true -f 1 -wi 1 -i 1 -w 100ms -r 100ms -rf json -rff build/results/jmh/smoke.json

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x gradlew
      - run: ./gradlew :native:check -PnativeSanitizers=true
