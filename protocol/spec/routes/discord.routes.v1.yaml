version: 1
family: discord
messages:
  - messageType: discord.link-code-created
    messageVersion: 1
    kind: event
    stream: xcore:evt:discord:link-code
    targetScope: broadcast
    ttlMs: 120000
    replayable: true
    idempotentConsumerRecommended: true
    owner: discord-linking
  - messageType: discord.link.confirm.command
    messageVersion: 1
    kind: command
    stream: xcore:cmd:discord-link-confirm:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 120000
    replayable: false
    idempotentConsumerRecommended: true
    owner: discord-linking
  - messageType: discord.unlink.command
    messageVersion: 1
    kind: command
    stream: xcore:cmd:discord-unlink:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 120000
    replayable: false
    idempotentConsumerRecommended: true
    owner: discord-linking
  - messageType: discord.link.status-changed
    messageVersion: 1
    kind: event
    stream: xcore:evt:discord:link-status
    targetScope: broadcast
    ttlMs: 120000
    replayable: true
    idempotentConsumerRecommended: true
    owner: discord-linking
  - messageType: discord.account.operation.request
    messageVersion: 1
    kind: rpc-request
    stream: xcore:rpc:req:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 10000
    replayable: false
    idempotentConsumerRecommended: true
    owner: discord-linking
    response:
      messageType: discord.account.operation.response
      messageVersion: 1
      stream: xcore:rpc:resp:{requester}
      bindings:
        requester: rpc.requester
