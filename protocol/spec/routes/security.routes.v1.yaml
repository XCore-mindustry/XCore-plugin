version: 1
family: security
messages:
  - messageType: player.password-reset.command
    messageVersion: 1
    kind: command
    stream: xcore:cmd:player-password-reset:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 120000
    replayable: false
    idempotentConsumerRecommended: true
    owner: player-session
