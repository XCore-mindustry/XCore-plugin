version: 1
family: cases
messages:
  - messageType: cases.report.submitted
    messageVersion: 1
    kind: event
    stream: xcore:evt:cases:report
    targetScope: broadcast
    ttlMs: 604800000
    replayable: true
    idempotentConsumerRecommended: true
    owner: cases
  - messageType: cases.notice.command
    messageVersion: 1
    kind: command
    stream: xcore:cmd:cases-notice:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 120000
    replayable: false
    idempotentConsumerRecommended: true
    owner: cases
  - messageType: cases.evidence.request
    messageVersion: 1
    kind: rpc-request
    stream: xcore:rpc:req:{server}
    bindings:
      server: payload.server
    targetScope: server
    ttlMs: 15000
    replayable: false
    idempotentConsumerRecommended: false
    owner: cases
    response:
      messageType: cases.evidence.response
      messageVersion: 1
      stream: xcore:rpc:resp:{requester}
      bindings:
        requester: rpc.requester
