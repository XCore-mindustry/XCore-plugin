name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync --all-groups

      - name: Validate generated artifacts
        run: |
          uv run python scripts/validate-generation.py
          uv run python scripts/validate-generated-models.py

      - name: Test Python package
        run: uv run pytest

      - name: Test Java package
        run: ./gradlew test

      - name: Build distributable packages
        run: |
          uv build
          ./gradlew jar sourcesJar

      - name: Verify built wheel installs
        working-directory: /tmp
        run: uv run --isolated --with "$GITHUB_WORKSPACE"/dist/*.whl python -c 'import xcore_protocol'

      - name: Upload distributable packages
        uses: actions/upload-artifact@v4
        with:
          name: xcore-protocol-packages
          path: |
            dist/*
            build/libs/*.jar
