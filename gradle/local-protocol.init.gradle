// Source validation across the workspace before publishing a protocol release.
// Usage: ./gradlew --init-script gradle/local-protocol.init.gradle test shadowJar
// CI can select a nested checkout with -PxcoreProtocolDir=xcore-protocol.
settingsEvaluated { settings ->
    if (settings.gradle.parent != null) return
    def protocolDirectory = new File(settings.settingsDir,
        settings.providers.gradleProperty('xcoreProtocolDir').getOrElse('../xcore-protocol'))
    if (!protocolDirectory.isDirectory()) {
        throw new GradleException("Expected xcore-protocol checkout: ${protocolDirectory}")
    }
    settings.includeBuild(protocolDirectory) {
        dependencySubstitution {
            substitute module('org.xcore:xcore-protocol-java') using project(':')
        }
    }
}
