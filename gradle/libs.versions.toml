[versions]
mindustry = "158"
xcore-protocol = "0.5.0"

# Plugins
toxopid = "4.1.2"
shadow = "9.3.0"

# Dependencies
cloud-mindustry = "0.2.0-SNAPSHOT"
mongodb = "5.6.2"
gson = "2.10.1"
jbcrypt = "0.4"
netty = "4.1.107.Final"
jline = "3.30.6"
lettuce = "6.8.1.RELEASE"
avaje = "12.3"
flubundle = "1.3"
lombok = "1.18.42"
junit = "5.14.0"
mockito = "5.20.0"
assertj = "3.27.4"
testcontainers = "1.21.3"

[plugins]
toxopid = { id = "com.xpdustry.toxopid", version.ref = "toxopid" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
cloud-mindustry = { module = "org.xcore:cloud-mindustry", version.ref = "cloud-mindustry" }
xcore-protocol-java = { module = "org.xcore:xcore-protocol-java", version.ref = "xcore-protocol" }
mongodb-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
jline-terminal = { module = "org.jline:jline-terminal-jna", version.ref = "jline" }
jline-reader = { module = "org.jline:jline-reader", version.ref = "jline" }
jline-console = { module = "org.jline:jline-console", version.ref = "jline" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
avaje-inject = { module = "io.avaje:avaje-inject", version.ref = "avaje" }
avaje-inject-generator = { module = "io.avaje:avaje-inject-generator", version.ref = "avaje" }
avaje-inject-test = { module = "io.avaje:avaje-inject-test", version.ref = "avaje" }
flubundle = { module = "com.ospx:flubundle", version.ref = "flubundle" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[bundles]
jline = ["jline-terminal", "jline-reader", "jline-console"]
