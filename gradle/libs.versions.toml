[versions]
mindustry = "v160"

# Plugins
toxopid = "4.2.0"
shadow = "9.6.1"

# Dependencies
cloud = "2.1.0"
fluent = "2.0.2-xcore"
icu4j = "78.3"
mongodb = "5.13.0"
gson = "2.14.0"
jbcrypt = "0.4"
netty = "4.2.19.Final"
lettuce = "7.8.0.RELEASE"
jackson = "3.2.3"
avaje = "12.7"
lombok = "1.18.48"
junit = "6.1.3"
mockito = "5.24.0"
assertj = "3.27.7"
testcontainers = "2.0.5"

[plugins]
toxopid = { id = "com.xpdustry.toxopid", version.ref = "toxopid" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[libraries]
mindustry-core = { module = "com.github.Anuken.Mindustry:core", version.ref = "mindustry" }
arc-core = { module = "com.github.Anuken.Arc:arc-core", version.ref = "mindustry" }
arc-g3d = { module = "com.github.Anuken.Arc:g3d", version.ref = "mindustry" }
cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud" }
cloud-annotations = { module = "org.incendo:cloud-annotations", version.ref = "cloud" }
fluent-base = { module = "net.xyzsd.fluent:fluent-base", version.ref = "fluent" }
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
mongodb-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
mongodb-reactive = { module = "org.mongodb:mongodb-driver-reactivestreams", version.ref = "mongodb" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jbcrypt = { module = "org.mindrot:jbcrypt", version.ref = "jbcrypt" }
netty-bom = { module = "io.netty:netty-bom", version.ref = "netty" }
netty-epoll = { module = "io.netty:netty-transport-native-epoll", version.ref = "netty" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
jackson-dataformat-toml = { module = "tools.jackson.dataformat:jackson-dataformat-toml", version.ref = "jackson" }
avaje-inject = { module = "io.avaje:avaje-inject", version.ref = "avaje" }
avaje-inject-generator = { module = "io.avaje:avaje-inject-generator", version.ref = "avaje" }
avaje-inject-test = { module = "io.avaje:avaje-inject-test", version.ref = "avaje" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
