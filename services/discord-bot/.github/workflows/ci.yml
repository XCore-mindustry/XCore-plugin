name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # mypy-baseline fails on a new error, and on a fixed one still in the baseline,
      # so the baseline only shrinks. After fixing errors: uv run mypy | uv run mypy-baseline sync
      - name: Type check
        run: uv run mypy | uv run mypy-baseline filter

      - name: Test
        run: uv run pytest -q
