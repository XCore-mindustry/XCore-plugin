name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shortcut: until xcore-protocol 0.17.0 is released, pyproject.toml builds the protocol from
      # ../xcore-protocol. Drop this step when the bot is pinned to the release tag again.
      - name: Check out xcore-protocol
        uses: actions/checkout@v7
        with:
          repository: XCore-mindustry/xcore-protocol
          ref: 5a1a86536087396df0fe0a752844068cfecad177
          path: xcore-protocol

      - name: Move xcore-protocol next to the bot
        run: mv xcore-protocol ../xcore-protocol

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      # mypy-baseline fails on a new error, and on a fixed one still in the baseline,
      # so the baseline only shrinks. After fixing errors: uv run mypy | uv run mypy-baseline sync
      - name: Type check
        run: uv run mypy | uv run mypy-baseline filter

      - name: Test
        run: uv run pytest -q
