[project]
name = "xcore-discord-bot"
version = "0.1.0"
description = "Standalone Discord bot for XCore Redis transport"
readme = "README.md"
authors = [
    { name = "osp54", email = "76648940+osp54@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "motor>=3.7.1",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.0",
    "redis>=5.2.1",
    "tenacity>=9.1.2",
    "xcore-protocol",
]

[tool.uv.sources]
# Pinned to an immutable revision, not a branch: a branch pin makes every build resolve a
# different commit of the protocol. The newest release tag (v0.6.2) predates the chat-domain
# decomposition this bot already imports, so it cannot be used until a new tag is cut on
# xcore-protocol @ main. Bump this rev when that tag exists.
xcore-protocol = { git = "https://github.com/XCore-mindustry/xcore-protocol.git", rev = "cb9e2b8210945aa31048587a73630780ecd245ae" }

[project.scripts]
xcore-discord-bot = "xcore_discord_bot.main:main"

[dependency-groups]
dev = [
    "fakeredis>=2.31.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = ["BLE001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
