plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'ospx'
def baseVersion = '2.1.0'
version = findProperty('xcorePublishVersion') ?: baseVersion
ext {
    mindustryVersion = "v160"
}

def xcoreSnapshotsRepositoryUrl = findProperty('xcoreMavenSnapshotsUrl') ?: 'https://maven.x-core.org/snapshots'
def xcoreReleasesRepositoryUrl = findProperty('xcoreMavenReleasesUrl') ?: 'https://maven.x-core.org/releases'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.x-core.org/releases" }
    maven { url "https://maven.x-core.org/snapshots" }
    maven { url "https://maven.xpdustry.com/mindustry" }
    maven { url "https://raw.githubusercontent.com/Zelaux/MindustryRepo/master/repository" }
    maven { url 'https://www.jitpack.io' }
}

publishing {
    repositories {
        maven {
            name = "xcoreRepositorySnapshots"
            url = uri(xcoreSnapshotsRepositoryUrl)
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }

        maven {
            name = "xcoreRepositoryReleases"
            url = uri(xcoreReleasesRepositoryUrl)
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    publications {
        maven(MavenPublication) {
            groupId = "com.ospx"
            artifactId = "flubundle"
            version = project.version
            from components.java
        }
    }
}

dependencies {
    compileOnly "com.github.Anuken.Mindustry:core:$mindustryVersion"
    compileOnly "com.github.Anuken.Arc:arc-core:$mindustryVersion"

    api "net.xyzsd.fluent:fluent-base:2.0.2-xcore"
    // DURATION formats units with CLDR data; same version fluent-base uses for plural rules.
    implementation "com.ibm.icu:icu4j:78.1"

    testImplementation platform('org.junit:junit-bom:6.1.3')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "com.github.Anuken.Mindustry:core:$mindustryVersion"
    testImplementation "com.github.Anuken.Arc:arc-core:$mindustryVersion"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Localized names of vanilla content (block.router.name, unit.dagger.name, team.sharded.name, ...)
// copied from Mindustry's own bundles. The dedicated server jar ships no bundles, so FluBundle
// carries them. Run after changing mindustryVersion and commit the result:
//   ./gradlew updateMindustryContentNames
tasks.register('updateMindustryContentNames') {
    group = 'flubundle'
    description = 'Copies vanilla content names from Mindustry bundles into src/main/resources.'
    def outputDir = file('src/main/resources/flubundle/mindustry')
    doLast {
        def checkout = layout.buildDirectory.dir('tmp/mindustry-bundles').get().asFile
        project.delete(checkout)
        def git = { File dir, List<String> args ->
            def process = new ProcessBuilder(['git'] + args).directory(dir).inheritIO().start()
            if (process.waitFor() != 0) {
                throw new GradleException("git ${args.join(' ')} failed")
            }
        }
        checkout.parentFile.mkdirs()
        git(checkout.parentFile, ['clone', '--quiet', '--depth', '1', '--branch', mindustryVersion,
                                  '--filter=blob:none', '--sparse',
                                  'https://github.com/Anuken/Mindustry', checkout.name])
        git(checkout, ['sparse-checkout', 'set', 'core/assets/bundles'])

        def keyPattern = ~/^(block|unit|item|liquid|status|team|planet|sector|weather)\.[^.]+\.name$/
        def read = { File f ->
            def props = new Properties()
            f.withReader('UTF-8') { props.load(it) }
            new TreeMap<String, String>(props.findAll { k, v -> k ==~ keyPattern })
        }
        def escape = { String s ->
            s.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace('\t', '\\t')
                    .replaceFirst(/^ /, '\\\\ ')
        }

        def bundles = new File(checkout, 'core/assets/bundles')
        def english = read(new File(bundles, 'bundle.properties'))
        project.delete(outputDir)
        outputDir.mkdirs()

        def locales = []
        bundles.listFiles().findAll { it.name ==~ /bundle(_.+)?\.properties/ }.sort { it.name }.each { file ->
            def code = file.name == 'bundle.properties' ? 'en' : file.name - 'bundle_' - '.properties'
            def names = read(file)
            if (code != 'en') {
                // updateBundles fills untranslated keys with English text; the runtime falls back
                // to English anyway, so keep only real translations.
                names = names.findAll { k, v -> english[k] != v }
            }
            locales << code
            new File(outputDir, "content_${code}.properties").withWriter('UTF-8') { out ->
                out << "# Generated by updateMindustryContentNames from Mindustry ${mindustryVersion}. Do not edit.\n"
                names.each { k, v -> out << "${k}=${escape(v)}\n" }
            }
        }
        new File(outputDir, 'locales').text = locales.join('\n') + '\n'
        logger.lifecycle("Wrote content names for ${locales.size()} locales (${english.size()} keys) to ${outputDir}")
    }
}
