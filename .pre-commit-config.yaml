repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^services/.*\.py$
      - id: ruff-format
        files: ^services/.*\.py$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        files: ^services/
      - id: trailing-whitespace
        files: ^services/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
