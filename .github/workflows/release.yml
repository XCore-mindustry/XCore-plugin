name: Release

# One tag per component release: <component>/vX.Y.Z, e.g. flubundle/v2.1.3 or xcore/v5.4.0.
# The version in the tag must equal the version in the component's build files.
on:
  push:
    tags: ['*/v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, <component>/vX.Y.Z
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !startsWith(inputs.tag || github.ref_name, 'tilelogger/') }}
    runs-on: ubuntu-latest
    environment: release
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve component
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([a-z-]+)/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Expected <component>/vX.Y.Z, got: $TAG" >&2
            exit 1
          fi
          component=${BASH_REMATCH[1]}
          case "$component" in
            flubundle)       projects=":libs:flubundle" ;;
            cloud-mindustry) projects=":libs:cloud-mindustry:lib" ;;
            xcore-ui)        projects=":libs:xcore-ui" ;;
            testkit)         projects=":libs:mindustry-testkit:core :libs:mindustry-testkit:ui :libs:mindustry-testkit:fixtures" ;;
            protocol)        projects=":protocol"; files="protocol/build/libs/*.jar" ;;
            xcore)           projects=":plugins:xcore"; files="plugins/xcore/build/libs/release/*.jar" ;;
            *) echo "Unknown component: $component" >&2; exit 1 ;;
          esac
          {
            echo "tag=$TAG"
            echo "component=$component"
            echo "version=${BASH_REMATCH[2]}"
            echo "projects=$projects"
            echo "files=${files:-}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Tag matches build version
        env:
          PROJECTS: ${{ steps.tag.outputs.projects }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          for project in $PROJECTS; do
            actual=$(./gradlew -q "$project:getProjectVersion" | tail -n 1)
            if [[ "$actual" != "$VERSION" ]]; then
              echo "$project is version $actual, tag says $VERSION" >&2
              exit 1
            fi
          done

      - name: Build, test and publish
        env:
          PROJECTS: ${{ steps.tag.outputs.projects }}
          ORG_GRADLE_PROJECT_xcoreRepositoryReleasesUsername: ${{ secrets.XCORE_USERNAME }}
          ORG_GRADLE_PROJECT_xcoreRepositoryReleasesPassword: ${{ secrets.XCORE_PASSWORD }}
        run: |
          tasks=()
          for project in $PROJECTS; do
            tasks+=("$project:build" "$project:publishAllPublicationsToXcoreRepositoryReleasesRepository")
          done
          ./gradlew "${tasks[@]}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.component }} ${{ steps.tag.outputs.version }}
          fail_on_unmatched_files: true
          files: ${{ steps.tag.outputs.files }}

  # PyPI trusted publishing is bound to a repository, workflow file and environment;
  # it has to be re-registered for this repository and release.yml before the first protocol release.
  pypi:
    needs: publish
    if: needs.publish.outputs.component == 'protocol'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.11
      - run: uv sync --locked --package xcore-protocol --extra dev
      - name: Validate and build
        run: |
          uv run --no-sync python scripts/validate-generation.py
          uv run --no-sync python scripts/validate-generated-models.py
          uv run --no-sync pytest
          uv build --package xcore-protocol --out-dir "$GITHUB_WORKSPACE/protocol/dist"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: protocol/dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.publish.outputs.tag }}
          files: |
            protocol/dist/*.whl
            protocol/dist/*.tar.gz
            protocol/dist/*.publish.attestation

  tilelogger-native:
    if: startsWith(inputs.tag || github.ref_name, 'tilelogger/')
    uses: ./.github/workflows/tilelogger-native.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      release: true

  tilelogger-release:
    permissions:
      contents: write
      actions: read
    needs: tilelogger-native
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tilelogger-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          fail_on_unmatched_files: true
          files: release/*.jar
