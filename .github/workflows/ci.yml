name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      menus: ${{ steps.filter.outputs.menus }}
      renderer: ${{ steps.filter.outputs.renderer }}
      protocol: ${{ steps.filter.outputs.protocol }}
      tilelogger: ${{ steps.filter.outputs.tilelogger }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - .github/workflows/**
              - build-logic/**
              - gradle/**
              - '*.gradle.kts'
              - gradle.properties
              - gradlew
            python: &python
              - .github/workflows/ci.yml
              - .github/workflows/release.yml
              - .dockerignore
              - pyproject.toml
              - uv.lock
              - .python-version
              - protocol/**
              - services/**
            jvm:
              - *shared
              - libs/**
              - plugins/**
              - protocol/**
            menus:
              - *shared
              - plugins/xcore/*.gradle.kts
              - libs/xcore-ui/*.gradle.kts
              - plugins/xcore/src/main/**
              - plugins/xcore/src/test/java/org/xcore/plugin/ui/**
              - plugins/xcore/tools/ui-render/**
              - libs/xcore-ui/src/main/**
              - libs/mindustry-testkit/**
            renderer:
              - .github/workflows/ci.yml
              - libs/mindustry-testkit/render/**
            tilelogger:
              - *shared
              - plugins/tilelogger/native/**
              - plugins/tilelogger/scripts/**
              - plugins/tilelogger/src/jmh/**
              - plugins/tilelogger/*.gradle.kts
              - plugins/tilelogger/plugin.json
            protocol:
              - *python

  gradle:
    needs: changes
    if: needs.changes.outputs.jvm == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Build and test everything
        run: ./gradlew build
      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: xcore-plugin
          path: plugins/xcore/build/libs/XCore-plugin-*.jar
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/

  menu-render:
    needs: changes
    if: needs.changes.outputs.menus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
      - name: Render every menu fixture in the phone, android1080 and pc profiles
        run: plugins/xcore/tools/ui-render/render
      - name: Upload packets, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: menu-client-render
          path: |
            plugins/xcore/build/ui-render/
            plugins/xcore/build/reports/tests/exportUiFixtures/
            plugins/xcore/build/test-results/exportUiFixtures/

  renderer-selfcheck:
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the real-client renderer catches broken menus
        run: libs/mindustry-testkit/render/render selfcheck

  protocol:
    needs: changes
    if: needs.changes.outputs.protocol == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.11
      - run: uv sync --locked --package xcore-protocol --extra dev
      - name: Generated code matches the spec
        run: |
          uv run --no-sync python scripts/validate-generation.py
          uv run --no-sync python scripts/validate-generated-models.py
          git diff --exit-code -- .
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Built wheel installs
        working-directory: /tmp
        run: uv run --isolated --with "$GITHUB_WORKSPACE"/protocol/dist/*.whl python -c 'import xcore_protocol'

  tilelogger-native:
    needs: changes
    if: needs.changes.outputs.tilelogger == 'true'
    uses: ./.github/workflows/tilelogger-native.yml
    with:
      ref: ${{ github.sha }}

  python-services:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      XCORE_TEST_MONGO_URL: mongodb://127.0.0.1:27017
      XCORE_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.14
      - run: uv sync --locked --all-packages --all-groups --all-extras
      - name: Bot lint, format and type baseline
        working-directory: services/discord-bot
        run: |
          uv run --no-sync ruff check
          uv run --no-sync ruff format --check
          uv run --no-sync mypy | uv run --no-sync mypy-baseline filter
      - name: Bot tests including real Mongo and Redis
        working-directory: services/discord-bot
        run: uv run --no-sync pytest -q
      - name: Gateway lint and tests
        working-directory: services/metrics-gateway
        run: |
          uv run --no-sync ruff check
          if ! uv run --no-sync ruff format --check; then
            echo "::warning::Gateway formatting differs from its existing baseline."
          fi
          uv run --no-sync pytest -q
      - name: Compose definition
        run: docker compose -f services/metrics-gateway/compose.yaml config --quiet

  gateway-compat:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv python install 3.13
      - run: uv sync --locked --package xcore-metrics-gateway --all-groups
      - working-directory: services/metrics-gateway
        run: uv run --no-sync pytest -q

  python-images:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: discord-bot
            module: xcore_discord_bot
          - service: metrics-gateway
            module: xcore_metrics_gateway
    steps:
      - uses: actions/checkout@v7
      - name: Build installed service and local protocol
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -f "services/$SERVICE/Dockerfile" -t xcore-service:ci .
      - name: Runtime imports without the source checkout
        env:
          MODULE: ${{ matrix.module }}
        run: |
          docker run --rm --network none -e MODULE --entrypoint python xcore-service:ci -c \
            'import importlib, os; import xcore_protocol; importlib.import_module(os.environ["MODULE"] + ".main")'

  # The only required check. Jobs skipped by the path filter count as passed.
  ci-ok:
    needs: [changes, gradle, menu-render, renderer-selfcheck, protocol, tilelogger-native, python-services, gateway-compat, python-images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
