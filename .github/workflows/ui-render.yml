name: Menu client render

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/java/org/xcore/plugin/ui/**'
      - 'tools/ui-render/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/ui-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Render Settings and Top in three viewport profiles
        run: tools/ui-render/render matrix
      - name: Verify that broken menus are rejected
        if: ${{ !cancelled() }}
        run: tools/ui-render/render selfcheck
      - name: Upload packets, screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: menu-client-render
          path: |
            build/ui-render/
            build/reports/tests/exportUiFixtures/
            build/test-results/exportUiFixtures/
