name: Build

on: [ push, workflow_dispatch ]

jobs:
  buildJar:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v3
        with:
          path: previous-version.txt
          key: previous-version

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew jar
