name: Build And Snapshot Publish

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XCORE_HAS_PUBLISH_CREDENTIALS: ${{ secrets.XCORE_USERNAME != '' && secrets.XCORE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve snapshot version
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          env.XCORE_HAS_PUBLISH_CREDENTIALS == 'true'
        run: |
          VERSION=$(./gradlew getProjectVersion -q | tail -n 1)
          CLEAN="${VERSION%-SNAPSHOT}"
          echo "XCORE_PUBLISH_VERSION=${CLEAN}-SNAPSHOT" >> "$GITHUB_ENV"

      - name: Build and test
        if: >-
          github.event_name != 'push' ||
          github.ref_name != github.event.repository.default_branch ||
          env.XCORE_HAS_PUBLISH_CREDENTIALS != 'true'
        run: ./gradlew --refresh-dependencies validateCi

      - name: Build, test and publish snapshot
        if: >-
          github.event_name == 'push' &&
          github.ref_name == github.event.repository.default_branch &&
          env.XCORE_HAS_PUBLISH_CREDENTIALS == 'true'
        run: >-
          ./gradlew --refresh-dependencies validateCi
          publishMavenPublicationToXcoreRepositorySnapshotsRepository
          -PxcorePublishVersion="$XCORE_PUBLISH_VERSION"
        env:
          ORG_GRADLE_PROJECT_xcoreRepositorySnapshotsUsername: >-
            ${{ secrets.XCORE_USERNAME }}
          ORG_GRADLE_PROJECT_xcoreRepositorySnapshotsPassword: >-
            ${{ secrets.XCORE_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-libs
          path: build/libs/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
