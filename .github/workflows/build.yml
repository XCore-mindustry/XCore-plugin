name: Build

on: [ push, workflow_dispatch ]

jobs:
  buildJar:
    runs-on: self-hosted
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew jar
        
      - name: Upload artifacts
        run: cp build/libs/XCore-plugin-*.jar ../../../build/
